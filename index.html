<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply the saved theme (dark by default) before first paint so nothing flashes. -->
    <script>
      try {
        var m = localStorage.getItem('dragonchat.mode') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', m);
        document.documentElement.style.colorScheme = m;
        if (m === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6efd9');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <style>
      html { background: #050505; }
      html[data-theme='light'] { background: #f6efd9; }
    </style>
    <meta name="description" content="Connect Different. Chat Real. — Dragon Chat by Caged Dragon Studios" />

    <!-- Standard + maskable icons (Android/Chrome) come from the web
         manifest, generated by vite-plugin-pwa. iOS ignores the
         manifest for home-screen icons, so it needs these explicitly. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS "Add to Home Screen" behavior: run full-screen instead of
         opening Safari chrome, and match the status bar to the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dragon Chat" />

    <title>Dragon Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
